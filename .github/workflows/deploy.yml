name: Deploy and restart server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build
        run: npm run build

  deploy:
    name: Pull latest code and restart server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          RESTART_COMMAND: ${{ secrets.RESTART_COMMAND }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: APP_DIR,RESTART_COMMAND
          script: |
            set -e

            if [ -z "$APP_DIR" ]; then
              echo "APP_DIR secret is required."
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            npm ci --force
            npm run build

            if [ -n "$RESTART_COMMAND" ]; then
              sh -lc "$RESTART_COMMAND"
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 restart looker-studio-pdf-api || pm2 start dist/main.js --name looker-studio-pdf-api
              pm2 save
            else
              echo "Set RESTART_COMMAND secret, or install pm2 on the server."
              exit 1
            fi
