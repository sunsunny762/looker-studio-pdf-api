substitutions:
  _REGION: europe-west2
  _SERVICE_NAME: looker-studio-pdf-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 4Gi
      - --cpu
      - "2"
      - --timeout
      - "900"
      - --concurrency
      - "1"
      - --cpu-boost
      - --startup-probe
      - httpGet.path=/health,initialDelaySeconds=0,timeoutSeconds=10,periodSeconds=10,failureThreshold=6
      - --set-env-vars
      - LOOKER_PUPPETEER_HEADLESS=true,LOOKER_PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium

images:
  - gcr.io/$PROJECT_ID/${_SERVICE_NAME}
